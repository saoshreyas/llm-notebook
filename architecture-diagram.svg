<svg width="900" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4aa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4ECDC4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f07178;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8B94;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffcc66;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFE66D;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="600" fill="#0a0e14"/>
  
  <!-- Title -->
  <text x="450" y="40" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#00d4aa" text-anchor="middle">
    LLM Notebook Architecture
  </text>

  <!-- Frontend Box -->
  <rect x="50" y="100" width="220" height="350" rx="15" fill="url(#grad1)" opacity="0.1" stroke="url(#grad1)" stroke-width="2"/>
  <text x="160" y="130" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#00d4aa" text-anchor="middle">
    Frontend
  </text>
  <text x="160" y="160" font-family="monospace" font-size="12" fill="#8a9199" text-anchor="middle">
    Port 3000
  </text>
  
  <text x="70" y="200" font-family="Arial, sans-serif" font-size="14" fill="#e6e6e6" font-weight="bold">
    React Components:
  </text>
  <text x="70" y="230" font-family="monospace" font-size="12" fill="#e6e6e6">
    • NotebookCell
  </text>
  <text x="70" y="255" font-family="monospace" font-size="12" fill="#e6e6e6">
    • Button (shadcn)
  </text>
  <text x="70" y="280" font-family="monospace" font-size="12" fill="#e6e6e6">
    • Card (shadcn)
  </text>
  
  <text x="70" y="320" font-family="Arial, sans-serif" font-size="14" fill="#e6e6e6" font-weight="bold">
    Styling:
  </text>
  <text x="70" y="345" font-family="monospace" font-size="12" fill="#e6e6e6">
    • Tailwind CSS
  </text>
  <text x="70" y="370" font-family="monospace" font-size="12" fill="#e6e6e6">
    • Custom animations
  </text>
  <text x="70" y="395" font-family="monospace" font-size="12" fill="#e6e6e6">
    • Dark theme
  </text>

  <text x="70" y="430" font-family="monospace" font-size="11" fill="#ffcc66" font-style="italic">
    Vite dev server
  </text>

  <!-- Backend Box -->
  <rect x="340" y="100" width="220" height="350" rx="15" fill="url(#grad2)" opacity="0.1" stroke="url(#grad2)" stroke-width="2"/>
  <text x="450" y="130" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#f07178" text-anchor="middle">
    Backend
  </text>
  <text x="450" y="160" font-family="monospace" font-size="12" fill="#8a9199" text-anchor="middle">
    Port 8000
  </text>
  
  <text x="360" y="200" font-family="Arial, sans-serif" font-size="14" fill="#e6e6e6" font-weight="bold">
    FastAPI Endpoints:
  </text>
  <text x="360" y="230" font-family="monospace" font-size="12" fill="#e6e6e6">
    • POST /process
  </text>
  <text x="360" y="255" font-family="monospace" font-size="12" fill="#e6e6e6">
    • GET /health
  </text>
  <text x="360" y="280" font-family="monospace" font-size="12" fill="#e6e6e6">
    • GET /models
  </text>
  
  <text x="360" y="320" font-family="Arial, sans-serif" font-size="14" fill="#e6e6e6" font-weight="bold">
    Processing:
  </text>
  <text x="360" y="345" font-family="monospace" font-size="12" fill="#e6e6e6">
    • Text translation
  </text>
  <text x="360" y="370" font-family="monospace" font-size="12" fill="#e6e6e6">
    • Balloon detection
  </text>
  <text x="360" y="395" font-family="monospace" font-size="12" fill="#e6e6e6">
    • SVG generation
  </text>

  <text x="360" y="430" font-family="monospace" font-size="11" fill="#ffcc66" font-style="italic">
    LiteLLM integration
  </text>

  <!-- vLLM Box -->
  <rect x="630" y="100" width="220" height="350" rx="15" fill="url(#grad3)" opacity="0.1" stroke="url(#grad3)" stroke-width="2"/>
  <text x="740" y="130" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffcc66" text-anchor="middle">
    vLLM Server
  </text>
  <text x="740" y="160" font-family="monospace" font-size="12" fill="#8a9199" text-anchor="middle">
    Supercomputer
  </text>
  
  <text x="650" y="200" font-family="Arial, sans-serif" font-size="14" fill="#e6e6e6" font-weight="bold">
    LLM Models:
  </text>
  <text x="650" y="230" font-family="monospace" font-size="12" fill="#e6e6e6">
    • Llama 2 7B
  </text>
  <text x="650" y="255" font-family="monospace" font-size="12" fill="#e6e6e6">
    • Mistral 7B
  </text>
  <text x="650" y="280" font-family="monospace" font-size="12" fill="#e6e6e6">
    • Custom models
  </text>
  
  <text x="650" y="320" font-family="Arial, sans-serif" font-size="14" fill="#e6e6e6" font-weight="bold">
    Features:
  </text>
  <text x="650" y="345" font-family="monospace" font-size="12" fill="#e6e6e6">
    • High throughput
  </text>
  <text x="650" y="370" font-family="monospace" font-size="12" fill="#e6e6e6">
    • Low latency
  </text>
  <text x="650" y="395" font-family="monospace" font-size="12" fill="#e6e6e6">
    • OpenAI-compatible
  </text>

  <text x="650" y="430" font-family="monospace" font-size="11" fill="#ffcc66" font-style="italic">
    GPU-accelerated
  </text>

  <!-- Arrows -->
  <!-- Frontend to Backend -->
  <defs>
    <marker id="arrowhead1" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#00d4aa" />
    </marker>
  </defs>
  <line x1="270" y1="275" x2="340" y2="275" stroke="#00d4aa" stroke-width="2" marker-end="url(#arrowhead1)"/>
  <text x="305" y="265" font-family="monospace" font-size="11" fill="#00d4aa" text-anchor="middle">
    HTTP
  </text>

  <!-- Backend to vLLM -->
  <defs>
    <marker id="arrowhead2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#f07178" />
    </marker>
  </defs>
  <line x1="560" y1="275" x2="630" y2="275" stroke="#f07178" stroke-width="2" marker-end="url(#arrowhead2)"/>
  <text x="595" y="265" font-family="monospace" font-size="11" fill="#f07178" text-anchor="middle">
    API
  </text>

  <!-- Data Flow Labels -->
  <rect x="50" y="500" width="800" height="80" rx="10" fill="#1a2028" stroke="#2a3138" stroke-width="1"/>
  <text x="450" y="525" font-family="Arial, sans-serif" font-size="16" fill="#00d4aa" text-anchor="middle" font-weight="bold">
    Data Flow
  </text>
  <text x="70" y="550" font-family="monospace" font-size="12" fill="#e6e6e6">
    1. User enters text → 2. Frontend sends to Backend → 3. Backend calls vLLM
  </text>
  <text x="70" y="570" font-family="monospace" font-size="12" fill="#e6e6e6">
    4. vLLM processes with AI → 5. Backend generates response → 6. Frontend displays results
  </text>

  <!-- Footer -->
  <text x="450" y="595" font-family="monospace" font-size="10" fill="#8a9199" text-anchor="middle">
    💡 FREE • Open Source • No API Costs
  </text>
</svg>
