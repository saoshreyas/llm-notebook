<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="'Source Sans 3', -apple-system, sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="400" y="35" text-anchor="middle" font-size="18" font-weight="700" fill="#333">LLM Notebook — Architecture</text>
  <text x="400" y="55" text-anchor="middle" font-size="12" fill="#777">Two-Stage Processing: Translate → Interpret</text>

  <!-- Frontend Box -->
  <rect x="40" y="80" width="320" height="200" rx="8" fill="#FFF5EE" stroke="#FF6B19" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="80" width="320" height="32" rx="8" fill="#FF6B19"/>
  <rect x="40" y="104" width="320" height="8" fill="#FF6B19"/>
  <text x="200" y="101" text-anchor="middle" font-size="13" font-weight="600" fill="#FFF">React Frontend (Port 3000)</text>
  <text x="60" y="140" font-size="11" fill="#555">• Jupyter-style UI</text>
  <text x="60" y="158" font-size="11" fill="#555">• NotebookCell (two-stage execution)</text>
  <text x="60" y="176" font-size="11" fill="#555">• CommandBar (keyboard shortcuts)</text>
  <text x="60" y="194" font-size="11" fill="#555">• InfoPanel (user guidance)</text>
  <text x="60" y="212" font-size="11" fill="#555">• State indicators: ⚪🔵🟡🟣🟢</text>
  <text x="60" y="236" font-size="10" fill="#999">Vite + Tailwind CSS + React 18</text>
  <text x="60" y="252" font-size="10" fill="#999">Proxies /api → localhost:8000</text>

  <!-- Backend Box -->
  <rect x="440" y="80" width="320" height="200" rx="8" fill="#F0F8FF" stroke="#2196F3" stroke-width="2" filter="url(#shadow)"/>
  <rect x="440" y="80" width="320" height="32" rx="8" fill="#2196F3"/>
  <rect x="440" y="104" width="320" height="8" fill="#2196F3"/>
  <text x="600" y="101" text-anchor="middle" font-size="13" font-weight="600" fill="#FFF">FastAPI Backend (Port 8000)</text>
  <text x="460" y="140" font-size="11" fill="#555">POST /translate → Stage 1 (LLM)</text>
  <text x="460" y="158" font-size="11" fill="#555">POST /interpret → Stage 2 (Local)</text>
  <text x="460" y="176" font-size="11" fill="#555">GET  /health   → Status check</text>
  <text x="460" y="194" font-size="11" fill="#555">GET  /models   → Available models</text>
  <text x="460" y="212" font-size="11" fill="#555">POST /process  → Legacy combined</text>
  <text x="460" y="236" font-size="10" fill="#999">FastAPI + LiteLLM + Uvicorn</text>
  <text x="460" y="252" font-size="10" fill="#999">Pydantic models + CORS</text>

  <!-- Arrow Frontend → Backend -->
  <line x1="360" y1="160" x2="440" y2="160" stroke="#FF6B19" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <text x="400" y="152" text-anchor="middle" font-size="9" fill="#FF6B19">/api/*</text>

  <line x1="440" y1="200" x2="360" y2="200" stroke="#2196F3" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <text x="400" y="218" text-anchor="middle" font-size="9" fill="#2196F3">JSON</text>

  <!-- vLLM Box -->
  <rect x="440" y="340" width="320" height="120" rx="8" fill="#F5FFF5" stroke="#4CAF50" stroke-width="2" filter="url(#shadow)"/>
  <rect x="440" y="340" width="320" height="32" rx="8" fill="#4CAF50"/>
  <rect x="440" y="364" width="320" height="8" fill="#4CAF50"/>
  <text x="600" y="361" text-anchor="middle" font-size="13" font-weight="600" fill="#FFF">vLLM Server (User-Provided)</text>
  <text x="460" y="398" font-size="11" fill="#555">OpenAI-compatible API</text>
  <text x="460" y="416" font-size="11" fill="#555">LLM inference for text translation</text>
  <text x="460" y="434" font-size="10" fill="#999">Free — runs on your own hardware</text>

  <!-- Arrow Backend → vLLM -->
  <line x1="600" y1="280" x2="600" y2="340" stroke="#4CAF50" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="620" y="315" font-size="9" fill="#4CAF50">LiteLLM</text>

  <!-- Execution flow -->
  <rect x="40" y="340" width="320" height="120" rx="8" fill="#FFFDE7" stroke="#F0AD4E" stroke-width="2" filter="url(#shadow)"/>
  <rect x="40" y="340" width="320" height="32" rx="8" fill="#F0AD4E"/>
  <rect x="40" y="364" width="320" height="8" fill="#F0AD4E"/>
  <text x="200" y="361" text-anchor="middle" font-size="13" font-weight="600" fill="#FFF">Execution Flow</text>
  <text x="60" y="398" font-size="11" fill="#555">1. User enters text, presses Shift+Enter</text>
  <text x="60" y="416" font-size="11" fill="#555">2. Stage 1: POST /translate → LLM lowercase</text>
  <text x="60" y="434" font-size="11" fill="#555">3. Stage 2: POST /interpret → Count balloons</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrowOrange" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#FF6B19"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2196F3"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4CAF50"/>
    </marker>
  </defs>
</svg>
