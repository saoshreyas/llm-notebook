[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "notebooklm"
version = "0.4.0"
description = "Notebook host for semantic DSL interpreters — NL → Workflow DSL → OpenRouter"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.109.0",
  "uvicorn[standard]>=0.27.0",
  "pydantic>=2.6.0",
  # Prefer a release with binary wheels on newer Pythons (latest may need Rust).
  "litellm>=1.40.0,<2",
  "python-multipart>=0.0.6",
  "lark>=1.1.0",
  "jinja2>=3.1.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
notebooklm = "notebooklm.cli:main"

[tool.setuptools.package-dir]
"" = "backend"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["notebooklm*", "workflow_dsl*", "app*", "dsl*"]

[tool.setuptools.package-data]
workflow_dsl = ["grammar.lark", "templates/*.j2"]
dsl = ["grammar.lark", "templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
