[build]
builder = "nixpacks"

[[services]]
name = "frontend"
source = "frontend"  # folder where your React app lives

[services.build]
buildCommand = "npm install && npm run build"

[services.deploy]
startCommand = "npx serve -s build -l 3000"
healthcheckPath = "/"

[[services]]
name = "backend"
source = "backend"  # folder where your FastAPI app lives

[services.build]
buildCommand = "pip install -r requirements.txt"

[services.deploy]
startCommand = "uvicorn main:app --host 0.0.0.0 --port 8000"
healthcheckPath = "/health"
